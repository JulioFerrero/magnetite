name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versions look like v1.2.3, got $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build the app and the DMG
        run: ./build.sh dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="build/Magnetite-$VERSION.dmg"
          PREVIOUS=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || true)
          {
            echo "## Install"
            echo
            echo "1. Download **Magnetite-$VERSION.dmg** below, open it and drag Magnetite to Applications."
            echo "2. Open Magnetite. macOS says it can't check the app, because it isn't notarized: go to System Settings → Privacy & Security, scroll down and click **Open Anyway**. You only do this once."
            echo "3. Press ⌘Space. If Spotlight opens instead, turn off its shortcut in System Settings → Keyboard → Keyboard Shortcuts → Spotlight."
            echo
            echo "Runs on macOS 14 or later on Apple silicon: Liquid Glass on macOS 26 and later, a solid background on 14 and 15."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then git log --pretty='- %s' "$PREVIOUS..HEAD"; else echo "- First release."; fi
            echo
            echo "SHA-256 \`$(shasum -a 256 "$DMG" | cut -d' ' -f1)\`"
          } > notes.md
          gh release create "$TAG" "$DMG" --target "$GITHUB_SHA" --title "Magnetite $VERSION" --notes-file notes.md
